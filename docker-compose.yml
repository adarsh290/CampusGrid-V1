version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    volumes:
      # Mount local storage for game files
      - ./storage:/storage
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - campusgrid-net
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: campusgrid-frontend-build
    volumes:
      - frontend-dist:/usr/src/app/dist

  nginx:
    image: nginx:1.21-alpine
    container_name: campusgrid-nginx
    restart: always
    ports:
      # Main entry point for the application
      - "8080:80"
    volumes:
      # Use the built static files from the frontend service
      - frontend-dist:/var/www/html:ro
      # Mount the nginx configuration
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount storage for NGINX to serve files from
      - ./storage:/protected-files:ro
    depends_on:
      - backend
      - frontend
      - mongo
    networks:
      - campusgrid-net

  mongo:
    image: mongo:5.0
    container_name: campusgrid-mongo
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - campusgrid-net

networks:
  campusgrid-net:
    driver: bridge

volumes:
  frontend-dist:
  mongo-data:
